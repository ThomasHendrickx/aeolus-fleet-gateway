function home(busy=false){const count=busy?20:2;return `<main class="main"><div class="intro"><h1>Good morning, Thomas</h1><p>Here is what needs you in Aeolus fleet.</p></div><div class="homegrid"><section><div class="attention">${link('waiting',`<span class="metric">${count}</span><span>waiting on you</span>${icon('ChevronRight')}`)}<div class="row">${tag(busy?'12 questions':'1 question')}${tag(busy?'8 steps':'1 step')}</div></div><div class="sectionhead"><h2>Waiting on you</h2>${link('waiting','View all'+(busy?' 20':''))}</div><div class="stack">${row('CircleHelp','Which goes first: the Compact look or Harbour?','orchestrator-1 · 12 min ago')}${row('Check','Create the GitHub repository','orchestrator-1 · 1 h ago','step')}${busy?row('CircleHelp','Approve the release candidate?','builder-core · 2 h ago'):''}</div>${busy?`<p class="meta tinygap">Showing 3 of 20. ${link('waiting','View all waiting items')}</p>`:''}${basketbar()}</section><section><div class="sectionhead" style="margin-top:0"><h2>Continue a conversation</h2>${link('conversations','View all')}</div><div class="stack">${row('MessagesSquare','orchestrator-1','Which goes first? · 12 min ago')}${row('MessagesSquare','builder-core','The candidate is ready to review. · 30 min ago')}${busy?'<p class="meta">20 new messages across your conversations</p>':''}</div><div class="sectionhead"><h2>Stay aware</h2>${link('aware','2 unseen')}</div><div class="stack">${row('CircleAlert','builder-gateway needs attention','watch · Report unchanged for 2 h','aware')}${row('Bell','aeolus-fleet 0.36.1 is out','releases · 1 h ago','aware')}</div><p class="meta tinygap">Alerts and notices are outside the waiting count.</p></section><section class="fleetcol"><div class="sectionhead"><h2>Your fleet</h2>${link('fleet','Open fleet')}</div><div class="harbour-reference">${harbour}</div></section></div></main>`}
function chats(){return `<main class="main narrow"><div class="pageheading row between"><h1>Conversations</h1><button class="btn" onclick="location.href='?state=compose&theme=${theme}'">${icon('Plus')} Message a ship</button></div><div class="search">${icon('Search')}<span>Find a ship</span></div><div class="stack">${row('MessagesSquare','orchestrator-1','Which goes first? · 1 question, 1 step waiting')}${row('MessagesSquare','builder-core','The candidate is ready to review. · 30 min ago')}${row('Bell','watch','builder-gateway needs attention · 2 h ago','aware')}</div></main>`}
function question(){const answered=state==='answered'||state==='sent', stale=state==='withdrawn', inBasket=state==='in-basket', failure=state==='send-error', pending=state==='putting';return `<article class="card qcard" id="question"><div class="row lead"><span class="tileicon wait">${icon('CircleHelp')}</span><div><span class="meta">Question · orchestrator-1 · 10:24</span><h2>Which goes first: the Compact look or Harbour?</h2></div></div><p class="context">The shared parts are ready. Should we finish the Compact look before building Harbour, or start Harbour now?</p>${answered?`<div class="notice ok">${icon('CheckCheck')} Answered ${state==='sent'?'in Bridge':'in Slack'} · ${query.get('answer')==='note'?'note alone':'option '+(query.get('answer')||'1')}<br><small>${query.get('answer')==='2'?'Start Harbour now.':query.get('answer')==='note'?'Your note was sent.':'Finish the Compact look first.'}</small></div>`:stale?'<div class="notice">Withdrawn by orchestrator-1. Nothing to answer.</div>':`<div class="options">${['Finish the Compact look first','Start Harbour now','No option, only a note'].map((t,i)=>`<label class="option"><input type="radio" name="answer" value="${i===2?'note':i+1}" ${i===0?'checked':''} ${pending?'disabled':''}><span>${t}</span>${i===0?tag("Asker's pick",'wait'):''}</label>`).join('')}</div><p class="meta">Asker's pick: the shared appearance should settle before the next view.</p><label style="display:block;margin-top:16px"><span class="label">Note (optional)</span><textarea placeholder="Add context to your answer" ${pending?'disabled':''}>${failure?'Finish the Compact look first.':''}</textarea></label>${inBasket?'<div class="notice tinygap">In the basket · option 1 · not sent<br><a href="?state=basket">Open basket</a> · <a href="?state=conversation">Remove</a></div>':''}${failure?'<div class="notice error tinygap" role="alert">The fleet did not take your answer. Your choice and note are kept. Try sending again.</div>':''}<div class="actions"><button class="btn primary" ${pending?'disabled':''} onclick="demoAction(this,'in-basket','Putting in basket...')">${icon(pending?'LoaderCircle':'ShoppingBasket')} ${pending?'Putting in basket...':'Put in basket'}</button><button class="btn primary" ${pending?'disabled':''} onclick="demoAction(this,'sent','Sending option 1...')">${icon('Send')} Send option 1</button></div><p class="meta tinygap">The basket keeps the answer unsent. Send option 1 answers now.</p>`}<div class="places"><small>${icon('MessagesSquare')} Also shown in Slack and a chat</small><small>Seen in Bridge · 10:24</small></div></article>`}
function convo(){return `<div class="convoLayout"><aside class="chatlist"><h2>Conversations</h2><div class="search">${icon('Search')} Find a ship</div><div class="stack">${row('MessagesSquare','orchestrator-1','1 question · 1 step waiting')}${row('MessagesSquare','builder-core','Ready for review')}</div></aside><section class="conversation"><header class="chathead">${link('home',icon('ChevronLeft'),'back btn ghost iconbtn')}<span class="tileicon">${icon('MessagesSquare')}</span><div><h1>orchestrator-1</h1><p class="meta">Aeolus fleet</p></div>${link('home','Back to home','btn ghost desktopcrumb')}</header><div class="chatbody"><div class="chatread"><div class="date">Today</div><div><div class="bubble">The shared parts are ready. I need your choice before planning the next slice.</div><small>10:22</small></div>${question()}${['answered','sent'].includes(state)?`<div class="bubble you">Option 1: finish the Compact look first.<br><small>Answered ${state==='sent'?'in Bridge':'in Slack'} · 10:42</small></div>`:''}<p class="meta">${link('step',icon('Check')+' Also waiting: create the GitHub repository')}</p></div></div><footer class="composer"><div class="row"><label style="flex:1;display:flex"><span hidden>Message orchestrator-1</span><input placeholder="Message orchestrator-1..."></label><button class="btn primary iconbtn" aria-label="Send message" onclick="demoAction(this,'message-sent','Sending...')">${icon('Send')}</button></div></footer></section></div>`}
function step(){const card=`<article class="card"><div class="row"><span class="tileicon wait">${icon('Check')}</span><h2>Create the GitHub repository</h2></div><p class="gap">The next slice needs a repository before the ship can push its work.</p><a class="btn gap" href="https://github.com/new">Open github.com ${icon('ExternalLink')}</a><label class="stack gap">Note (optional)<textarea placeholder="Add a note for Done or Cannot"></textarea></label><div class="actions"><button class="btn primary" onclick="demoAction(this,'step-done','Sending Done...')">Done</button><button class="btn" onclick="demoAction(this,'step-cannot','Sending Cannot...')">Cannot</button></div><p class="meta tinygap">The outcome and your note are sent immediately.</p></article>`;return convo().replace(question(),card)}
function more(){return `<main class="main narrow"><div class="pageheading"><h1>More</h1><p class="muted tinygap">Aeolus fleet</p></div><div class="sheetlist">${row('Bell','Stay aware','Alerts and notices · 2 unseen','aware')}${row('History','Done','Read back outcomes and where you acted','done')}${row('UserRound','Waits at argo','Questions and steps for argo','argo')}${row('Settings','Where things show','Your choices for Bridge, Slack and chats','settings')}${row('ExternalLink','Outside parties','Gateway settings','settings')}${row('ArrowUpRight','Fleets and account','Opens the Account app','settings')}</div></main>`}

function states(){let title='Nothing waits on you',body='Your conversations and past outcomes are still here.',error=false;if(state==='error'){title='Could not read your record';body='Nothing was changed. The fleet did not answer. Try again.';error=true}if(state==='partial'){return `<main class="main"><div class="notice">Your fleet could not be read. Your questions and conversations are available. <button class="btn">Try fleet again</button></div>${home(false).replace('<main class="main">','<div>').replace('</main>','</div>')}</main>`}if(state==='loading')return `<main class="main"><div class="intro"><h1>Bridge</h1></div><div class="homegrid"><section class="stack"><div class="skeleton" style="height:150px"></div><div class="skeleton"></div><div class="skeleton"></div></section><section class="stack"><div class="skeleton"></div><div class="skeleton"></div></section></div><p class="meta gap">Reading your record...</p></main>`;return `<main class="main narrow"><div class="state-empty">${icon(error?'CircleAlert':'CheckCheck')}<h2>${title}</h2><p class="muted">${body}</p><div class="gap">${error?'<button class="btn primary">Try again</button>':link('conversations','Open conversations','btn')}</div></div></main>`}
function simple(){const text=state==='message-sent'?'Message sent to orchestrator-1':state==='step-done'?'Step done · note sent to orchestrator-1':state==='step-cannot'?'Cannot complete the step · note sent':state==='basket-empty'?'Removed from the basket · the question still waits':state==='basket-sent'?'1 answer sent · the question is answered':'This place is drawn in its own part';return `<main class="main narrow"><div class="notice ok">${icon('CheckCheck')} ${text}</div><div class="gap">${link('home','Back to home','btn')}</div></main>`}
const convostates=['sent','conversation','answered','withdrawn','send-error','in-basket','putting'];
const content=state==='home'?home():state==='busy'?home(true):state==='conversations'?chats():convostates.includes(state)?convo():state==='step'?step():state==='more'?more():state==='basket'?basket():state==='done'?done():state==='aware'?aware():state==='fleet'?`<main class="main"><h1>Your fleet</h1><div class="gap">${harbour}</div></main>`:state==='waiting'?waiting():['empty','error','partial','loading'].includes(state)?states():simple();
document.body.classList.toggle('conversationpage',convostates.includes(state));
const tools=query.has('tools')?`<div class="demo-tools"><b>Design for approval</b><label>View <select onchange="location.href='?tools&state='+this.value+'&theme=${theme}'">${['home','conversation','step','basket','done','aware','more','busy','waiting','in-basket','putting','answered','withdrawn','send-error','empty','loading','error','partial'].map(s=>`<option ${s===state?'selected':''}>${s}</option>`).join('')}</select></label>${link(state,'Switch theme','btn').replace('theme='+theme,'theme='+(theme==='light'?'dark':'light')+'&tools')}</div>`:'';
document.getElementById('app').innerHTML=tools+sidebar()+`<div class="shell">${topbar()}${content}</div>`+tabs()+'<span class="draft">#266 · proposal, not approved</span>';
function refreshAnswer(){const chosen=document.querySelector('input[name=answer]:checked')?.value;const field=document.querySelector('#question textarea');const actions=document.querySelectorAll('#question .actions button');if(actions.length!==2)return;actions[0].disabled=chosen==='note'&&!field.value.trim();actions[1].disabled=actions[0].disabled;actions[1].innerHTML=icon('Send')+' '+(chosen==='note'?'Send the note alone':'Send option '+chosen)}
document.querySelectorAll('input[name=answer],#question textarea').forEach(field=>field.addEventListener('input',refreshAnswer));
function demoAction(button,next,label){const chosen=document.querySelector('input[name=answer]:checked')?.value;if(next==='sent')label=chosen==='note'?'Sending the note...':'Sending option '+chosen+'...';button.disabled=true;button.innerHTML=icons.LoaderCircle+' '+label;button.setAttribute('aria-busy','true');setTimeout(()=>{location.href='?state='+next+'&theme='+theme+(next==='sent'?'&answer='+chosen:'')},900)}
</script></body></html>
