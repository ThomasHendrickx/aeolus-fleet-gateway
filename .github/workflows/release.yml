# Publishes @aeolus-fleet/gateway to npm and tags v<version> the
# released commit, so a version on npm always matches a tag in git. Then
# creates the GitHub Release for the tag, with notes from the merged pull
# requests carrying the label <version>, and the ChatGPT plugin's package
# attached with its notes.
#
# The only way the package can be published: npm trusted publishing (OIDC) is
# configured for exactly this file name, and tokens are disallowed (decision
# 0011). Never add an NPM_TOKEN or any other npm secret. Provenance is automatic.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the gateway, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  id-token: write
  # To push the release tag and create its GitHub Release.
  contents: write
  # To read the merged pull requests carrying the release's label, for its notes.
  pull-requests: read
  # To read CI's result for the released commit.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain releases only: npm needs a dist-tag for a prerelease, which this workflow does not set.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci

      # No second test run (decision 0011): CI's own result for this exact commit on
      # the release branch is the gate, read before anything is built or published.
      - name: Check the commit is on a release branch and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --event push --json status,conclusion,url \
            | node scripts/release-gate.ts "$GITHUB_REF" "$GITHUB_SHA"

      # The one package is the repository's root: npm sets its version, and
      # common and core keep their ranges, as other trains (decision 0049).
      - name: Set the version on the gateway
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - run: npm run build

      # The ChatGPT plugin's package (chatgpt-plugin design, 7.6), built and
      # checked before anything is published: a package that breaks OpenAI's
      # limits, or a tool without its three hints, fails the release. It is
      # compared with the latest release's package and tools; a release with
      # none, as before the plugin, counts every tool as new.
      - name: Build the ChatGPT plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-plugin"
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous" ]]; then
            # A release from before the plugin has no such assets: gh says no asset matches.
            gh release download "$previous" --pattern 'aeolus-*.zip' --pattern 'aeolus-*.tools.json' --dir "$RUNNER_TEMP/previous-plugin" \
              || echo "$previous has no plugin package"
          fi
          npm run plugin:build -- --previous "$RUNNER_TEMP/previous-plugin" --out "$RUNNER_TEMP/plugin"

      # Catches a problem in the package before it is published. A dry run
      # refuses a version on npm already too, so it skips it, as the publish
      # step below does.
      - name: Dry run
        env:
          PACKAGE: '@aeolus-fleet/gateway'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --dry-run --access public
          fi

      # Skips a version on npm already, so releasing a version again after it
      # failed partway only tags it. Dispatch it again from main: Re-run jobs
      # replays the failed run's own copy of this file.
      - name: Publish @aeolus-fleet/gateway
        env:
          PACKAGE: '@aeolus-fleet/gateway'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public
          fi

      # After the package is on npm. If this step fails, push the tag by hand:
      # the version is already published and cannot be released again.
      - name: Tag v${{ inputs.version }}, the released commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # Notes from the merged pull requests labelled with the version: git and the
      # labels are the source, there is no changelog file. Then the plugin's
      # notes, and its ZIP and tools attached. Skipped when the Release exists
      # already, as when a release is dispatched again.
      - name: Create the GitHub Release v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub Release v$VERSION exists already"
            exit 0
          fi
          gh pr list --state merged --label "$VERSION" --json number,title,url --limit 1000 \
            | node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          { echo; cat "$RUNNER_TEMP/plugin/aeolus-$VERSION.notes.md"; } >> "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/plugin/aeolus-$VERSION.zip" "$RUNNER_TEMP/plugin/aeolus-$VERSION.tools.json"
