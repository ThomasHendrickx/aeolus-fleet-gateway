# Publishes @aeolus-fleet/gateway to npm and tags v<version> the
# released commit, so a version on npm always matches a tag in git. It
# publishes the tarball a run of candidate.yml packed, the one staging walked,
# and builds no package itself. Then
# creates the GitHub Release for the tag, with notes from the merged pull
# requests carrying the label <version>, and the ChatGPT plugin's package
# attached with its notes.
#
# The only way the package can be published: npm trusted publishing (OIDC) is
# configured for exactly this file name, and tokens are disallowed (decision
# 0011). Never add an NPM_TOKEN or any other npm secret. Provenance is automatic.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the gateway, MAJOR.MINOR.PATCH
        required: true
        type: string
      candidate_run_id:
        description: The run of candidate.yml whose tarball is published, packed from this commit at this version
        required: true
        type: string
      override_reason:
        description: Only Thomas, to release without a passed staging walk; the reason goes into the log and the Release notes
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  # To push the release tag and create its GitHub Release.
  contents: write
  # To read the merged pull requests carrying the release's label, for its notes.
  pull-requests: read
  # To read CI's result for the released commit, and download the candidate's tarball.
  actions: read
  # To read the staging-walk status the walker set on the released commit.
  statuses: read
  # To read the release's milestone and close it.
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain releases only: npm needs a dist-tag for a prerelease, which this workflow does not set.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci

      # No second test run (decision 0011): CI's own result for this exact commit on
      # the release branch is the gate, read before anything is built or published.
      - name: Check the commit is on a release branch and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --event push --json status,conclusion,url \
            | node scripts/release-gate.ts "$GITHUB_REF" "$GITHUB_SHA"

      # The walker's staging-walk status of this candidate run at this version, or Thomas's reason to release without it.
      - name: Check the staging walk passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            | node scripts/staging-walk-gate.ts "$GITHUB_SHA" "$VERSION" "$RUN_ID" "$GITHUB_REPOSITORY_OWNER" "$GITHUB_ACTOR" "$OVERRIDE_REASON"

      - name: Download the candidate's tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].name')
          gh run download "$RUN_ID" --name "$name" --dir "$RUNNER_TEMP/candidate"
          ls -l "$RUNNER_TEMP/candidate"

      - name: Check the candidate is this commit at this version, byte for byte
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          gh run view "$RUN_ID" --json workflowName,conclusion,headSha \
            | node scripts/candidate-check.ts "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/candidate"

      # Only the ChatGPT plugin's package below reads this version: the gateway
      # published is the candidate's tarball, built nowhere here.
      - name: Set the version on the gateway
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      # The ChatGPT plugin's package (chatgpt-plugin design, 7.6), built and
      # checked before anything is published: a package that breaks OpenAI's
      # limits, or a tool without its three hints, fails the release. It is
      # compared with the latest release's package and tools; a release with
      # none, as before the plugin, counts every tool as new.
      - name: Build the ChatGPT plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-plugin"
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous" ]]; then
            # A release from before the plugin has no such assets: gh says no asset matches.
            gh release download "$previous" --pattern 'aeolus-*.zip' --pattern 'aeolus-*.tools.json' --dir "$RUNNER_TEMP/previous-plugin" \
              || echo "$previous has no plugin package"
          fi
          npm run plugin:build -- --previous "$RUNNER_TEMP/previous-plugin" --out "$RUNNER_TEMP/plugin"

      # The milestone "gateway <version>" is the release's scope: open issues in it
      # stop the run before anything is published. A hotfix without one goes on.
      # A lookup that fails fails the run (shell: bash adds pipefail).
      - name: Check the release's milestone has no open issues
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          MILESTONE="gateway $VERSION"
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            | jq -r --arg title "$MILESTONE" '.[] | select(.title == $title) | .number')
          if [[ -z "$number" ]]; then
            echo "No milestone named '$MILESTONE': going on without one." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?milestone=$number&state=open&per_page=100" \
            | jq -r '.[] | "#\(.number) \(.title)"')
          if [[ -n "$open" ]]; then
            echo "::error::Milestone '$MILESTONE' has open issues, nothing is published:"
            echo "$open"
            exit 1
          fi
          echo "Milestone '$MILESTONE' has no open issues." | tee -a "$GITHUB_STEP_SUMMARY"

      # Catches a problem in the package before it is published. A dry run
      # refuses a version on npm already too, so it skips it, as the publish
      # step below does.
      - name: Dry run
        env:
          PACKAGE: '@aeolus-fleet/gateway'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --dry-run --access public "$RUNNER_TEMP/candidate/aeolus-fleet-gateway-$VERSION.tgz"
          fi

      # Skips a version on npm already, so releasing a version again after it
      # failed partway only tags it. Dispatch it again from main: Re-run jobs
      # replays the failed run's own copy of this file.
      - name: Publish @aeolus-fleet/gateway
        env:
          PACKAGE: '@aeolus-fleet/gateway'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public "$RUNNER_TEMP/candidate/aeolus-fleet-gateway-$VERSION.tgz"
          fi

      # After the package is on npm. If this step fails, push the tag by hand:
      # the version is already published and cannot be released again.
      - name: Tag v${{ inputs.version }}, the released commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # Notes from the merged pull requests labelled with the version: git and the
      # labels are the source, there is no changelog file. Then the plugin's
      # notes, and its ZIP and tools attached. Skipped when the Release exists
      # already, as when a release is dispatched again.
      - name: Create the GitHub Release v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub Release v$VERSION exists already"
            exit 0
          fi
          gh pr list --state merged --label "$VERSION" --json number,title,url --limit 1000 \
            | node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          { echo; cat "$RUNNER_TEMP/plugin/aeolus-$VERSION.notes.md"; } >> "$RUNNER_TEMP/release-notes.md"
          if [[ -n "${OVERRIDE_REASON// /}" ]]; then
            printf '\n**Released without a passed staging walk**, by %s: %s\n' "$GITHUB_ACTOR" "$OVERRIDE_REASON" >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/plugin/aeolus-$VERSION.zip" "$RUNNER_TEMP/plugin/aeolus-$VERSION.tools.json"

      # After the release is out, so a run that failed before it leaves the
      # milestone open. Closing a closed milestone changes nothing, as when a
      # release is dispatched again.
      - name: Close the release's milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          MILESTONE="gateway $VERSION"
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            | jq -r --arg title "$MILESTONE" '.[] | select(.title == $title) | .number')
          if [[ -z "$number" ]]; then
            echo "No milestone named '$MILESTONE': nothing to close." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed > /dev/null
          echo "Closed milestone '$MILESTONE'." | tee -a "$GITHUB_STEP_SUMMARY"
