name: CI

on:
  pull_request:
  push:
    branches: [main, 'hotfix/**']

permissions:
  contents: read

env:
  NODE_VERSION: 26

# A later push to a pull request cancels its earlier run; a push to main or a hotfix branch never
# cancels another, so every commit there keeps its own CI result.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/install
      - run: npm run typecheck
      - run: npm run lint
      # The browser the web parts' browser tests run in.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit

  integration:
    name: Integration tests (Postgres in Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/install
      # The images Testcontainers starts, from the Actions cache.
      - uses: ./.github/actions/test-images
      - run: npm run test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Check for test container and volume leftovers
        if: ${{ !cancelled() }}
        run: node scripts/check-test-run-leftovers.ts

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The one job that always installs fresh, whatever the cache holds: it proves a package.json
      # change still installs from package-lock.json (#446).
      - run: npm ci
      # The same steps as release.yml, with a throwaway prerelease version:
      # npm requires a tag for a prerelease.
      - run: npm version "0.0.0-ci.${{ github.run_id }}" --no-git-tag-version
      - run: npm run build
      - run: npm publish --dry-run --access public --tag dry-run
