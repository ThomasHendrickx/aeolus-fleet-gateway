<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge · Question</title>
<style>
:root{color-scheme:light;--bg:#fcfcfd;--card:#fff;--side:#f5f6f8;--text:#242a35;--muted:#69717f;--line:#e0e3e8;--tint:#edf2fa;--ink:#304e7c;--button:#293e60;--on:#fff;--ok:#256346;--error:#a32f31}html.dark{color-scheme:dark;--bg:#141821;--card:#1b202b;--side:#181d27;--text:#e7eaf0;--muted:#a2aaba;--line:#343c4a;--tint:#263348;--ink:#adcbff;--button:#b7cff7;--on:#17243b;--ok:#9edab6;--error:#ffb2b3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);border-right:1px solid var(--line);padding:24px 14px}.brand{font-size:20px;font-weight:650;padding:0 12px 30px}.nav{padding:11px 12px;border-radius:7px;color:var(--muted)}.nav.on{color:var(--ink);background:var(--tint)}.count{float:right}.main{margin-left:220px}header{height:57px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}.live{font-size:12px;color:var(--ok);margin-left:auto}.avatar{border:1px solid var(--line);border-radius:50%;padding:4px 9px}.split{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 57px)}.list{border-right:1px solid var(--line);padding-top:26px}.list h2{font-size:17px;padding:0 20px}.row{margin:8px;padding:16px 12px;border:1px solid var(--line);border-radius:8px;background:var(--tint)}.row.other{background:none;border-color:transparent}.meta,small{color:var(--muted);font-size:12px}.row p{margin:4px 0 0}article{padding:32px;max-width:760px}.eyebrow{color:var(--muted);margin-bottom:18px}.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:3px 8px;margin-bottom:12px;background:var(--side)}h1{font-size:23px;line-height:1.3;margin:0 0 20px;font-weight:650}.notice{border:1px solid var(--line);border-radius:8px;padding:17px;background:var(--side);margin:0 0 24px}.notice b{display:block;margin-bottom:6px}.notice p{margin:0;color:var(--muted)}.context{margin:24px 0}.option{border:1px solid var(--line);border-radius:7px;padding:13px 15px;margin:10px 0}.selected{border-color:var(--ink);background:var(--tint)}.pick{float:right;font-size:11px;color:var(--muted)}textarea{display:block;width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:10px;font:inherit;margin:8px 0 16px;color:var(--text)}button{min-height:44px;padding:10px 17px;border:1px solid var(--line);border-radius:6px;font:600 14px system-ui;background:var(--card);color:var(--text);cursor:pointer}.primary{background:var(--button);color:var(--on);border-color:var(--button)}button:disabled{opacity:.65;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:10px}.foot{margin-top:28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:16px}.error{color:var(--error);margin-bottom:16px}.success{color:var(--ok)}nav.phone{display:none}.spinner{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:7px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){aside,.list{display:none}.main{margin:0}header{padding:0 16px}.crumb{font-weight:600}.split{display:block;min-height:0}article{padding:24px 18px 100px}h1{font-size:21px}nav.phone{display:flex;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--card);padding:14px 4px 22px;color:var(--muted);font-size:12px}.phone .active{color:var(--ink)}.desktop{display:none}}
</style>
<aside><div class="brand">◈ Bridge</div><div class="nav on">Waiting on you <span class="count">1</span></div><div class="nav">Stay aware</div><div class="nav">Basket</div><div class="nav">Done</div><div class="nav">Your fleet</div><div class="nav">Messages</div></aside>
<div class="main"><header><span class="crumb"><span class="desktop">Aeolus fleet / </span>Question</span><span class="live">● Live</span><span class="avatar">A</span></header><div class="split"><section class="list"><h2>Waiting on you <span class="meta">1</span></h2><div class="row"><b>Which should we build first?</b><p class="meta" id="rowmeta">Decide · design-scout · 12 min</p></div><div class="row other"><b>Your other questions are answered</b><p class="meta">Find them under Done.</p></div></section><article id="content" aria-live="polite"></article></div></div><nav class="phone"><span class="active">Waiting 1</span><span>Aware</span><span>Basket</span><span>Done</span><span>Fleet</span></nav>
<script>
const params=new URLSearchParams(location.search);document.documentElement.classList.toggle('dark',params.get('theme')==='dark');let state=params.get('state')||'after';
const content=document.querySelector('#content');
function render(){const before=state==='before',checking=state==='checking',unknown=state==='unknown',generic=state==='withdrawn',removed=state==='removed';
const notice=generic?'Question withdrawn':checking?'Checking the asking ship…':unknown?'The asking ship could not be checked':'Asking ship retired';
const explanation=generic?'Nothing to answer: it is done.':checking?'Wait while Bridge checks whether this question can still be answered.':unknown?'Bridge could not check whether design-scout can receive an answer. Try again before answering.':'design-scout is retired. This question can no longer be answered.';
content.innerHTML=`<div class="eyebrow">${before?'Decide':'Question'} · question from <b>design-scout</b> · 10:24</div>${before?'':`<span class="badge">${generic?'Withdrawn':checking?'Checking':unknown?'Not checked':'Retired'}</span>`}<h1>Which should we build first?</h1>${before?'':`<div class="notice" role="status"><b>${checking?'<span class="spinner"></span>':''}${notice}</b><p>${explanation}</p></div>`}${removed?'<div class="notice success"><b>Question removed from Waiting on you.</b><p>No answer was sent. The question is kept under Done.</p></div>':`<div class="context">The next part is ready to design. Which should go first?</div><div class="option ${before?'selected':''}">${before?'◉':'○'} 1. Fleet overview <span class="pick">Their pick</span></div><div class="option">○ 2. Message history</div><p class="meta">Their pick: fleet overview, so you can see which ships need attention.</p>${before?'<label>Note (optional)<textarea placeholder="Add a note"></textarea></label><p class="meta">Their pick, not sent.</p><div class="actions"><button>Put in basket</button><button>Send answer now</button></div>':checking?'<button disabled><span class="spinner"></span>Checking…</button>':unknown?'<button class="primary" id="retry">Try again</button>':generic?'<p class="meta">No answer was sent.</p>':`${state==='error'?'<p class="error" role="alert">The question could not be removed. Try again.</p>':''}<div class="actions"><button class="primary" id="remove" ${state==='removing'?'disabled':''}>${state==='removing'?'<span class="spinner"></span>Removing…':state==='error'?'Try removing again':'Remove question'}</button></div><p class="meta">Removes it from Waiting on you. Keeps it under Done. No answer is sent.</p>`}`}
<div class="foot">${removed?'Done · Not answered':before?'Shown in Bridge':'The question and its options are kept for reference.'}</div>`;
document.querySelector('#rowmeta').textContent=before?'Decide · design-scout · 12 min':generic?'Withdrawn · design-scout':checking?'Checking · design-scout':unknown?'Not checked · design-scout':'Retired · design-scout';
if(removed){document.querySelector('.list h2').innerHTML='Waiting on you <span class="meta">0</span>';document.querySelector('.row').style.display='none';document.querySelector('.count').textContent='0';document.querySelector('.phone .active').textContent='Waiting 0'}
document.querySelector('#remove')?.addEventListener('click',()=>{state='removing';render();setTimeout(()=>{state=params.get('fail')==='1'?'error':'removed';render()},1100)});
document.querySelector('#retry')?.addEventListener('click',()=>{state='checking';render();setTimeout(()=>{state='after';render()},1100)});
}render();
</script></html>
